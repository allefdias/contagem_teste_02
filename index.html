<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>Contagens</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- CSS -->
  <link rel="stylesheet" href="index.css">

  <!-- JS -->
  <script src="index.js" defer></script>
</head>

<body>
  <div class="container">

    <h1>Contagens</h1>
    <span id="dataHoje"></span>

    <!-- CONTROLE DE DATA -->
    <div class="controle-data">
      <button type="button" id="btnAlterarData" onclick="alternarData()">Alterar data</button>
      <input type="date" id="inputData">
      <button type="button" id="btnConfirmarData" onclick="confirmarData()">Confirmar</button>
    </div>

    <!-- SETORES -->
    <div id="setoresContainer"></div>
    <div class="acoes">
      <button type="button" onclick="adicionarSetor()">+ Adicionar Setor</button>
    </div>

    <!-- OBSERVAÇÕES -->
    <div class="observacoes">
      <label for="observacoes"><strong>Observações:</strong></label>
      <textarea id="observacoes" rows="3" placeholder="Digite observações gerais, se necessário..."></textarea>
    </div>

    <!-- AÇÕES -->
    <div class="acoes">
      <button type="button" class="gerar" onclick="gerarRelatorio()">📄 Gerar Relatório</button>
    </div>

    <!-- RELATÓRIO -->
    <div id="relatorio" class="output" style="display:none;"></div>

    <!-- AÇÕES RELATÓRIO -->
    <div class="acoes-relatorio" id="acoesRelatorio" style="display:none;">
      <button type="button" id="btnEnviarPlanilha" class="planilha" onclick="enviarParaGoogleSheets()">📊 Salvar no Google Sheets</button>
      <button type="button" id="btnEnviar" onclick="enviarParaWhatsApp()">📲 Enviar para WhatsApp</button>
    </div>

    <!-- DATALISTS -->
    <datalist id="nomesSalvosList"></datalist>
    <datalist id="setoresList"></datalist>

  </div>
</body>

</html>
